*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

.shell{display:flex;min-height:100vh;position:relative;z-index:1}
.sidebar{width:236px;position:fixed;inset:0 auto 0 0;z-index:30;display:flex;flex-direction:column;background:var(--sb);padding:18px 14px}

.nav{flex:1;display:flex;flex-direction:column;gap:3px}.sec{font-size:10.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#5f5e78;padding:16px 12px 6px}

.ni:hover{background:rgba(255,255,255,.07);color:#fff}.ni.on{background:var(--g);color:#fff;box-shadow:0 8px 20px color-mix(in srgb,var(--accent) 40%,transparent)}

.topbar .t{font-weight:800;font-size:17px;letter-spacing:-.02em;margin-right:auto;display:flex;align-items:center;gap:10px}.topbar .t .logo{display:none;width:32px;height:32px;border-radius:10px}

.kpi .l{font-size:12px;font-weight:700;color:var(--dim)}.kpi .v{font-size:26px;font-weight:800;letter-spacing:-.03em;line-height:1.15}.kpi .s{font-size:12px;color:var(--dim);margin-top:4px}

.btn.g{background:var(--s2);color:var(--text);box-shadow:none;border:1px solid var(--border)}.btn.sm{height:32px;padding:0 13px;font-size:12px}

.tb{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.tb input,.tb select{width:auto;min-width:140px;flex:1 1 150px;max-width:250px;height:42px;border-radius:999px}

.bar{height:10px;background:var(--s2);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--g);border-radius:99px}
.row{display:flex;align-items:center;gap:12px;padding:9px 0}.row .sp{flex:1}.empty{text-align:center;color:var(--faint);padding:36px 10px;font-weight:700}
.sc{display:none}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}.fld label{display:block;font-size:12px;font-weight:800;color:var(--dim);margin-bottom:6px}.fld.full{grid-column:1/-1}
.dl{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px 20px;margin:12px 0}.dl dt{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}.dl dd{margin:3px 0 0;font-weight:700}
.ov{position:fixed;inset:0;background:rgba(6,5,14,.6);backdrop-filter:blur(6px);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px}
.md{background:var(--surface);border-radius:26px;width:min(680px,100%);max-height:92vh;overflow:auto;padding:24px;box-shadow:var(--shl)}.md h2{margin:0 0 4px;font-size:22px;letter-spacing:-.02em}
.hist{border-left:2px solid var(--border);padding:2px 0 2px 12px;margin:8px 0;font-size:12.5px;color:var(--dim)}
.bottom{display:none}
@media(max-width:900px){.sidebar{display:none}.main{margin-left:0}.topbar{padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top))}.topbar .t .logo{display:flex}.page{padding:4px 16px 110px}.ph h1{font-size:25px}.kpi.big{grid-column:span 2}
.bottom{display:flex;position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:40;background:var(--sb);border-radius:24px;padding:6px;box-shadow:var(--shl)}
.bottom button{flex:1;background:none;border:0;color:#8c8ba5;font-size:10.5px;font-weight:800;padding:7px 0;border-radius:18px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}.bottom button span{font-size:19px}.bottom button.on{background:var(--g);color:#fff}
.tw{display:none}.sc{display:block}.sc .card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:14px;margin-bottom:10px;box-shadow:var(--sh)}}
@media(max-width:700px){.kpis{grid-template-columns:1fr 1fr}.md{border-radius:26px 26px 0 0;align-self:flex-end;max-height:94vh}.ov{padding:0}.cols{grid-template-columns:1fr}}

.lg{width:min(400px,100%)!important;text-align:center}.lg .fld{text-align:left}.logo.big{width:60px;height:60px;border-radius:20px;margin:0 auto 10px;font-size:26px}
.ferr{background:var(--bad-d);color:var(--bad);padding:11px 14px;border-radius:14px;margin-top:14px;font-weight:700}.ferr:empty{display:none}
.chk{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1.5px solid var(--border);border-radius:14px;background:var(--s2);cursor:pointer;font-weight:700}.chk input{width:18px;height:18px;accent-color:var(--accent);flex-shrink:0}
.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.cred{display:grid;grid-template-columns:1fr 1fr;gap:12px;background:var(--s2);border-radius:18px;padding:16px}.cred small{color:var(--faint);font-weight:800;font-size:11px;letter-spacing:.08em}.cred b{display:block;font-size:18px;margin-top:4px;word-break:break-all}
.steps{display:flex;margin:16px 0}.stp{flex:1;text-align:center;position:relative;font-size:11px;font-weight:800;color:var(--faint)}.stp i{display:flex;width:30px;height:30px;border-radius:50%;background:var(--s2);border:2px solid var(--border);margin:0 auto 4px;align-items:center;justify-content:center;font-style:normal;position:relative;z-index:1}
.stp:not(:last-child):after{content:"";position:absolute;top:14px;left:calc(50% + 15px);right:calc(-50% + 15px);height:2px;background:var(--border)}.stp.ok:not(:last-child):after{background:var(--accent)}
.stp.ok i{background:var(--g);color:#fff;border-color:transparent}.stp.ok{color:var(--text)}.stp.cur i{border-color:var(--accent);color:var(--accent)}.stp.cur{color:var(--accent)}

#bell{position:relative}#bdg{position:absolute;top:-5px;right:-5px;background:var(--pink);color:#fff;border-radius:99px;font-size:10px;padding:1px 6px;font-weight:800}#bdg:empty{display:none}
.nd{position:absolute;right:0;top:50px;width:min(390px,92vw);max-height:72vh;overflow:auto;background:var(--surface);border:1px solid var(--border);border-radius:24px;box-shadow:var(--shl);z-index:50;padding:8px}.nd[hidden]{display:none}
.nh{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;font-weight:800;font-size:16px}
.ni2{display:flex;gap:12px;padding:12px;border-radius:18px;cursor:pointer;align-items:flex-start}.ni2:hover{background:var(--s2)}.ni2.un{background:var(--tint)}.ni2 .ic{width:40px;height:40px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0;background:var(--s2)}.ni2.un .ic{background:var(--g)}
.ni2 b,.ni2 span,.ni2 small{display:block}.ni2 span{font-size:13px;margin:1px 0}.ni2 small{color:var(--faint);font-size:11.5px;font-weight:700}
.pbar{margin:4px 4px 8px;padding:12px 14px;border-radius:18px;background:var(--g);color:#fff;display:flex;align-items:center;gap:12px;font-weight:700;font-size:13px}
@media(max-width:700px){.nd{position:fixed;left:10px;right:10px;top:calc(62px + env(safe-area-inset-top));width:auto;max-height:78vh}.btn.big{width:100%}.row .btn{flex:1 1 auto}.md{padding:20px 18px}.kpi.big{grid-column:span 2}}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:14px 0 6px}.tile{background:var(--s2);border-radius:16px;padding:10px 13px}.tile small{display:block;font-size:10.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--faint)}.tile b{display:block;font-size:16px;margin-top:2px;word-break:break-word}

.btn.big{height:48px;font-size:15px;padding:0 26px}.job{cursor:pointer;margin-top:12px}.job:active{transform:scale(.98)}.btn[disabled]{opacity:.5;pointer-events:none}

/* ---------- location: fast first fix, then refine — never waits more than ~10 s ---------- */
let GPSERR=0,GFIX=null;   // GFIX = last good fix (reused for 60 s so pins are instant)
function bestGPS(onUpd,{want=50,soft=4000,max=10000,fresh=false}={}){return new Promise(ok=>{GPSERR=0;if(!navigator.geolocation){GPSERR=2;return ok(null)}let best=null,done=false,wid=null;
 if(!fresh&&GFIX&&Date.now()-GFIX.t<60000&&GFIX.acc<=Math.max(want,60)){const g={lat:GFIX.lat,lng:GFIX.lng,acc:GFIX.acc};try{onUpd&&onUpd(g)}catch(e){}return ok(g)}
 const fin=()=>{if(done)return;done=true;try{if(wid!=null)navigator.geolocation.clearWatch(wid)}catch(e){}clearTimeout(t1);clearTimeout(t2);ok(best)};
 const take=p=>{if(done)return;const g={lat:+p.coords.latitude.toFixed(7),lng:+p.coords.longitude.toFixed(7),acc:Number.isFinite(p.coords.accuracy)?Math.round(p.coords.accuracy):9999};if(!GFIX||g.acc<=GFIX.acc||Date.now()-GFIX.t>20000)GFIX={...g,t:Date.now()};if(!best||g.acc<best.acc){best=g;try{onUpd&&onUpd(g)}catch(e){}}if(g.acc<=want)fin()};
 const bad=e=>{GPSERR=e&&e.code||2;if(e&&e.code==1)fin()};
 try{navigator.geolocation.getCurrentPosition(take,bad,{enableHighAccuracy:false,maximumAge:120000,timeout:5000})}catch(e){}
 try{wid=navigator.geolocation.watchPosition(take,bad,{enableHighAccuracy:true,maximumAge:0,timeout:max})}catch(e){}
 const t1=setTimeout(fin,max),t2=setTimeout(()=>{if(best)fin()},soft)})}
// warm up GPS in the background (only when permission was already given — never pops a prompt)
function gpsWarm(){try{if(GFIX&&Date.now()-GFIX.t<30000)return;navigator.permissions&&navigator.permissions.query({name:'geolocation'}).then(p=>{if(p.state=='granted')bestGPS(null,{want:30,soft:8000,max:12000,fresh:true})}).catch(()=>{})}catch(e){}}

function parseCSV(t){const rows=[];let r=[],f='',q=false;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}else if(c=='"')q=true;else if(c==','){r.push(f);f=''}else if(c=='\n'||c=='\r'){if(c=='\r'&&t[i+1]=='\n')i++;r.push(f);f='';if(r.some(x=>x.trim()))rows.push(r);r=[]}else f+=c}r.push(f);if(r.some(x=>x.trim()))rows.push(r);return rows}

async function saveLeave(){const P=LVK=='Permission',b={kind:LVK,from_date:$('lf').value,reason:$('lr').value.trim()};
 if(P){b.session=LVS;b.from_time=$('lft').value;b.to_time=$('ltt').value}else{b.to_date=$('lt').value;b.leave_type=LVT}
 if(!b.from_date){$('lerr').textContent='Choose the date';return}if(!b.reason){$('lerr').textContent='Write the reason';return}
 $('lsb').disabled=true;const r=await api('/api/leave',{m:'POST',b});if(r.error){$('lsb').disabled=false;$('lerr').textContent=r.error;return}
 closeM();toast('Sent for approval ✓');AM=b.from_date.slice(0,7);ATab='me';AU=null;if(view=='att')Att();else nav('att')}
/* dashboard: today's attendance board for Super Admin / Admin staff */
async function attBoard(){if(!canAtt())return '';const b=await api('/api/attendance/board').catch(()=>null);if(!b||b.error)return '';
 const P=(u,extra)=>`<div class="bp">${avH(u.user_id||u.id,u.name,u.photo_v,'sm')}<div class="sp" style="min-width:0"><b>${esc(u.name)}</b><small>${extra}</small></div></div>`;
 const pend=b.pending.filter(r=>r.user_id!=ME.id||SUP());
 return `<div class="panel tboard"><div class="pt"><h3>Today · ${dW(b.today)}</h3><button class="btn g sm" onclick="ATab='team';AU=null;nav('att')">Attendance ›</button></div>
 <div class="asum">${[['In office',b.inn.length+' / '+b.total,'#1f9255'],['On leave',b.leave.length,'#7c4dff'],['Permission',b.perm.length,'#2f6fe4'],['Not in yet',b.notIn.length,'#d6322c'],['Waiting approval',pend.length,'#a86a00']].map(([l,v,c])=>`<div style="--c:${c}"><b>${v}</b><small>${l}</small></div>`).join('')}</div>
 <div class="cols">
  <div><div class="sec4" style="--c:#7c4dff">🌴 On leave today</div>${b.leave.map(r=>P(r,`${esc(r.leave_type||'Leave')}${r.to_date!=b.today?' · till '+dW(r.to_date):''}`)).join('')||'<div class="dim">Nobody on leave</div>'}</div>
  <div><div class="sec4" style="--c:#2f6fe4">🕘 Permission today</div>${b.perm.map(r=>P(r,`<span style="color:${r.session=='Morning'?'#2f6fe4':'#e0761b'}">${r.session}</span>${r.from_time?' · '+t12(r.from_time)+(r.to_time?' – '+t12(r.to_time):''):''}`)).join('')||'<div class="dim">No permissions</div>'}</div>
 </div>
 ${pend.length?`<div class="sec4" style="--c:#a86a00;margin-top:14px">⏳ Waiting for your approval</div>${pend.slice(0,5).map(r=>reqCard(r,false)).join('')}${pend.length>5?`<button class="btn g sm" onclick="ATab='req';nav('att')">See all ${pend.length}</button>`:''}`:''}
 ${b.notIn.length?`<details class="hx"><summary>Not checked in yet · ${b.notIn.length}</summary><div class="chips" style="margin-top:6px">${b.notIn.map(u=>`<span class="chp" style="cursor:default">${esc(u.name)}</span>`).join('')}</div></details>`:''}
 ${b.inn.length?`<details class="hx"><summary>Checked in · ${b.inn.length}</summary>${b.inn.map(u=>P(u,`In ${u.in}${u.late?' <b style="color:#d6322c">late</b>':''}${u.out?' · Out '+u.out:''}`)).join('')}</details>`:''}</div>`}
/* new request pops up for approvers */
function reqPop(n){if(!canAtt()||view=='att'&&ATab=='req')return;modal(`<div class="remh"><div class="remi">${ic('bell',30)}</div><div class="kick">New request</div><h2>${esc(n.title.replace(/^\W+/,''))}</h2><p class="dim">${esc(n.body)}</p></div><div class="row" style="margin-top:12px"><button class="btn g sp" onclick="closeM()">Later</button><button class="btn sp" onclick="openAttLink('leave')">Open requests</button></div>`)}
/* ---------- mobile bottom navigation: 4 main tabs + More ---------- */
const PRIM=['todo','tdash','jobs','dash','services','leads','att'];
function bottomNav(v){const all=menu().filter(n=>n[0]!='me'),prim=PRIM.map(k=>all.find(n=>n[0]==k)).filter(Boolean).slice(0,4),rest=all.filter(n=>!prim.includes(n));
 const moreOn=v=='me'||rest.some(n=>n[0]==v);
 $('bnav').innerHTML=prim.map(n=>`<button class="${n[0]==v?'on':''}" onclick="nav('${n[0]}')"><span>${ic(n[2],22)}</span><em>${n[0]=='todo'?'To-do':n[1]}</em></button>`).join('')+
  `<button class="${moreOn?'on':''}" onclick="moreSheet()"><span>${ic('grid',22)}</span><em>${moreOn&&v!='me'?(rest.find(n=>n[0]==v)||[0,'More'])[1]:'More'}</em></button>`;
 window._rest=rest}
function moreSheet(){const rest=window._rest||[];modal(`<div class="row" style="padding:0 0 10px"><div class="amh" style="border:0;padding:0;margin:0;flex:1"><div class="av">${ini(ME.name)}</div><div><b>${esc(ME.name)}</b><div class="dim">${esc(ME.role)}</div></div></div>${X}</div>
 <div class="mgrid">${rest.map(n=>`<button class="mt ${n[0]==view?'on':''}" onclick="closeM();nav('${n[0]}')"><span>${ic(n[2],24)}</span>${n[1]}</button>`).join('')}
 <button class="mt ${view=='me'?'on':''}" onclick="closeM();nav('me')"><span>${ic('cog',24)}</span>Profile</button>
 <button class="mt" onclick="toggleDark()"><span>${ic('moon',24)}</span>Dark mode</button>
 <button class="mt" onclick="closeM();setTimeout(toggleND,30)"><span>${ic('bell',24)}</span>Alerts</button>
 <button class="mt red" onclick="closeM();logout()"><span>${ic('out',24)}</span>Sign out</button></div>`)}

(async()=>{try{ME=await api('/api/me');await boot()}catch(e){if(!ME)showLogin()}
 if('serviceWorker' in navigator){navigator.serviceWorker.register('/sw.js').catch(()=>{});navigator.serviceWorker.addEventListener('message',e=>{if(!e.data)return;if(e.data.todo)openTodoLink(e.data.todo);else if(e.data.att)openAttLink('att');else if(e.data.sid)gotoJob(e.data.sid)})}})();
