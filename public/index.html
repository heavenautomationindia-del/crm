*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

.shell{display:flex;min-height:100vh;position:relative;z-index:1}
.sidebar{width:236px;position:fixed;inset:0 auto 0 0;z-index:30;display:flex;flex-direction:column;background:var(--sb);padding:18px 14px}

.nav{flex:1;display:flex;flex-direction:column;gap:3px}.sec{font-size:10.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#5f5e78;padding:16px 12px 6px}

.ni:hover{background:rgba(255,255,255,.07);color:#fff}.ni.on{background:var(--g);color:#fff;box-shadow:0 8px 20px color-mix(in srgb,var(--accent) 40%,transparent)}

.topbar .t{font-weight:800;font-size:17px;letter-spacing:-.02em;margin-right:auto;display:flex;align-items:center;gap:10px}.topbar .t .logo{display:none;width:32px;height:32px;border-radius:10px}

.kpi .l{font-size:12px;font-weight:700;color:var(--dim)}.kpi .v{font-size:26px;font-weight:800;letter-spacing:-.03em;line-height:1.15}.kpi .s{font-size:12px;color:var(--dim);margin-top:4px}

.btn.g{background:var(--s2);color:var(--text);box-shadow:none;border:1px solid var(--border)}.btn.sm{height:32px;padding:0 13px;font-size:12px}

.tb{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.tb input,.tb select{width:auto;min-width:140px;flex:1 1 150px;max-width:250px;height:42px;border-radius:999px}

.bar{height:10px;background:var(--s2);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--g);border-radius:99px}
.row{display:flex;align-items:center;gap:12px;padding:9px 0}.row .sp{flex:1}.empty{text-align:center;color:var(--faint);padding:36px 10px;font-weight:700}
.sc{display:none}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}.fld label{display:block;font-size:12px;font-weight:800;color:var(--dim);margin-bottom:6px}.fld.full{grid-column:1/-1}
.dl{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px 20px;margin:12px 0}.dl dt{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}.dl dd{margin:3px 0 0;font-weight:700}
.ov{position:fixed;inset:0;background:rgba(6,5,14,.6);backdrop-filter:blur(6px);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px}
.md{background:var(--surface);border-radius:26px;width:min(680px,100%);max-height:92vh;overflow:auto;padding:24px;box-shadow:var(--shl)}.md h2{margin:0 0 4px;font-size:22px;letter-spacing:-.02em}
.hist{border-left:2px solid var(--border);padding:2px 0 2px 12px;margin:8px 0;font-size:12.5px;color:var(--dim)}
.bottom{display:none}
@media(max-width:900px){.sidebar{display:none}.main{margin-left:0}.topbar{padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top))}.topbar .t .logo{display:flex}.page{padding:4px 16px 110px}.ph h1{font-size:25px}.kpi.big{grid-column:span 2}
.bottom{display:flex;position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:40;background:var(--sb);border-radius:24px;padding:6px;box-shadow:var(--shl)}
.bottom button{flex:1;background:none;border:0;color:#8c8ba5;font-size:10.5px;font-weight:800;padding:7px 0;border-radius:18px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}.bottom button span{font-size:19px}.bottom button.on{background:var(--g);color:#fff}
.tw{display:none}.sc{display:block}.sc .card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:14px;margin-bottom:10px;box-shadow:var(--sh)}}
@media(max-width:700px){.kpis{grid-template-columns:1fr 1fr}.md{border-radius:26px 26px 0 0;align-self:flex-end;max-height:94vh}.ov{padding:0}.cols{grid-template-columns:1fr}}

.lg{width:min(400px,100%)!important;text-align:center}.lg .fld{text-align:left}.logo.big{width:60px;height:60px;border-radius:20px;margin:0 auto 10px;font-size:26px}
.ferr{background:var(--bad-d);color:var(--bad);padding:11px 14px;border-radius:14px;margin-top:14px;font-weight:700}.ferr:empty{display:none}
.chk{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1.5px solid var(--border);border-radius:14px;background:var(--s2);cursor:pointer;font-weight:700}.chk input{width:18px;height:18px;accent-color:var(--accent);flex-shrink:0}
.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.cred{display:grid;grid-template-columns:1fr 1fr;gap:12px;background:var(--s2);border-radius:18px;padding:16px}.cred small{color:var(--faint);font-weight:800;font-size:11px;letter-spacing:.08em}.cred b{display:block;font-size:18px;margin-top:4px;word-break:break-all}
.steps{display:flex;margin:16px 0}.stp{flex:1;text-align:center;position:relative;font-size:11px;font-weight:800;color:var(--faint)}.stp i{display:flex;width:30px;height:30px;border-radius:50%;background:var(--s2);border:2px solid var(--border);margin:0 auto 4px;align-items:center;justify-content:center;font-style:normal;position:relative;z-index:1}
.stp:not(:last-child):after{content:"";position:absolute;top:14px;left:calc(50% + 15px);right:calc(-50% + 15px);height:2px;background:var(--border)}.stp.ok:not(:last-child):after{background:var(--accent)}
.stp.ok i{background:var(--g);color:#fff;border-color:transparent}.stp.ok{color:var(--text)}.stp.cur i{border-color:var(--accent);color:var(--accent)}.stp.cur{color:var(--accent)}

#bell{position:relative}#bdg{position:absolute;top:-5px;right:-5px;background:var(--pink);color:#fff;border-radius:99px;font-size:10px;padding:1px 6px;font-weight:800}#bdg:empty{display:none}
.nd{position:absolute;right:0;top:50px;width:min(390px,92vw);max-height:72vh;overflow:auto;background:var(--surface);border:1px solid var(--border);border-radius:24px;box-shadow:var(--shl);z-index:50;padding:8px}.nd[hidden]{display:none}
.nh{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;font-weight:800;font-size:16px}
.ni2{display:flex;gap:12px;padding:12px;border-radius:18px;cursor:pointer;align-items:flex-start}.ni2:hover{background:var(--s2)}.ni2.un{background:var(--tint)}.ni2 .ic{width:40px;height:40px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0;background:var(--s2)}.ni2.un .ic{background:var(--g)}
.ni2 b,.ni2 span,.ni2 small{display:block}.ni2 span{font-size:13px;margin:1px 0}.ni2 small{color:var(--faint);font-size:11.5px;font-weight:700}
.pbar{margin:4px 4px 8px;padding:12px 14px;border-radius:18px;background:var(--g);color:#fff;display:flex;align-items:center;gap:12px;font-weight:700;font-size:13px}
@media(max-width:700px){.nd{position:fixed;left:10px;right:10px;top:calc(62px + env(safe-area-inset-top));width:auto;max-height:78vh}.btn.big{width:100%}.row .btn{flex:1 1 auto}.md{padding:20px 18px}.kpi.big{grid-column:span 2}}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:14px 0 6px}.tile{background:var(--s2);border-radius:16px;padding:10px 13px}.tile small{display:block;font-size:10.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--faint)}.tile b{display:block;font-size:16px;margin-top:2px;word-break:break-word}

.btn.big{height:48px;font-size:15px;padding:0 26px}.job{cursor:pointer;margin-top:12px}.job:active{transform:scale(.98)}.btn[disabled]{opacity:.5;pointer-events:none}

/* ---------- location: fast first fix, then refine — never waits more than ~10 s ---------- */
let GPSERR=0,GFIX=null;   // GFIX = last good fix (reused for 60 s so pins are instant)
function bestGPS(onUpd,{want=50,soft=4000,max=10000,fresh=false}={}){return new Promise(ok=>{GPSERR=0;if(!navigator.geolocation){GPSERR=2;return ok(null)}let best=null,done=false,wid=null;
 if(!fresh&&GFIX&&Date.now()-GFIX.t<60000&&GFIX.acc<=Math.max(want,60)){const g={lat:GFIX.lat,lng:GFIX.lng,acc:GFIX.acc};try{onUpd&&onUpd(g)}catch(e){}return ok(g)}
 const fin=()=>{if(done)return;done=true;try{if(wid!=null)navigator.geolocation.clearWatch(wid)}catch(e){}clearTimeout(t1);clearTimeout(t2);ok(best)};
 const take=p=>{if(done)return;const g={lat:+p.coords.latitude.toFixed(7),lng:+p.coords.longitude.toFixed(7),acc:Number.isFinite(p.coords.accuracy)?Math.round(p.coords.accuracy):9999};if(!GFIX||g.acc<=GFIX.acc||Date.now()-GFIX.t>20000)GFIX={...g,t:Date.now()};if(!best||g.acc<best.acc){best=g;try{onUpd&&onUpd(g)}catch(e){}}if(g.acc<=want)fin()};
 const bad=e=>{GPSERR=e&&e.code||2;if(e&&e.code==1)fin()};
 try{navigator.geolocation.getCurrentPosition(take,bad,{enableHighAccuracy:false,maximumAge:120000,timeout:5000})}catch(e){}
 try{wid=navigator.geolocation.watchPosition(take,bad,{enableHighAccuracy:true,maximumAge:0,timeout:max})}catch(e){}
 const t1=setTimeout(fin,max),t2=setTimeout(()=>{if(best)fin()},soft)})}
// warm up GPS in the background (only when permission was already given — never pops a prompt)
function gpsWarm(){try{if(GFIX&&Date.now()-GFIX.t<30000)return;navigator.permissions&&navigator.permissions.query({name:'geolocation'}).then(p=>{if(p.state=='granted')bestGPS(null,{want:30,soft:8000,max:12000,fresh:true})}).catch(()=>{})}catch(e){}}
const gpsMsg=()=>GPSERR==1?'Location permission is blocked. Allow location for this app in your phone settings, then try again.':'Could not get your location. Turn on GPS (Location) and try again — near a window or outside works best.';

const csvCell=x=>{x=String(x??'');if(/^[=+\-@]/.test(x))x="'"+x;return '"'+x.replace(/"/g,'""')+'"'};
function dlCSV(name,rows){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+rows.map(r=>r.map(csvCell).join(',')).join('\r\n')],{type:'text/csv'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}

function parseCSV(t){const rows=[];let r=[],f='',q=false;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}else if(c=='"')q=true;else if(c==','){r.push(f);f=''}else if(c=='\n'||c=='\r'){if(c=='\r'&&t[i+1]=='\n')i++;r.push(f);f='';if(r.some(x=>x.trim()))rows.push(r);r=[]}else f+=c}r.push(f);if(r.some(x=>x.trim()))rows.push(r);return rows}
async function impL(inp){const f=inp.files[0];if(!f)return;const e=$('ie');e.style.display='block';e.textContent='Reading…';
 const t=(await f.text()).replace(/^\ufeff/,''),rows=parseCSV(t);if(rows.length<2){e.textContent='No rows found in this file';return}
 const AL={name:['name','full name','customer','lead'],phone:['phone','mobile','number','contact'],email:['email','e-mail'],source:['source'],interest:['interest','interested in','requirement','product'],priority:['priority'],stage:['stage','status'],follow_up:['follow-up','followup','follow up','next follow-up'],value:['value','amount','budget','expected value'],address:['address','area','location'],notes:['notes','remarks','comment','comments']};
 const H=rows[0].map(h=>h.trim().toLowerCase()),idx={};for(const k in AL)idx[k]=H.findIndex(h=>AL[k].includes(h));
 if(idx.name<0){e.textContent='The file needs a "Name" column';return}
 const data=rows.slice(1).map(r=>{const o={};for(const k in idx)if(idx[k]>=0)o[k]=(r[idx[k]]||'').trim();return o});
 let add=0,skip=0;for(let i=0;i<data.length;i+=200){e.textContent=`Importing ${Math.min(i+200,data.length)} of ${data.length}…`;const r=await api('/api/leads/import',{m:'POST',b:{rows:data.slice(i,i+200)}});if(r.error){e.textContent=r.error;return}add+=r.added;skip+=r.skipped}
 closeM();toast(`${add} imported, ${skip} skipped`);Leads()}

let BL=[];
function billSec(s){BL=(Array.isArray(s.bill_items)&&s.bill_items.length?s.bill_items:[{d:'',q:1,r:''}]).map(x=>({...x}));const billed=s.bill_state=='Billed';
 return `<div class="sec3">🧾 ${billed?'Bill #'+s.bill_no:'Quotation'}</div><div class="billbox">
 ${billed?`<div class="hint">Billed on ${fmt(s.billed_at)} · waiting for the customer’s payment. Use <b>Payment received</b> below once the money comes in.</div>`:'<div class="hint">Write the quotation — work done, parts, charges. Save as many times as needed, then convert it to the bill.</div>'}
 <div id="bl">${billRows(billed)}</div>${billed?'':`<button class="lnk" onclick="BL.push({d:'',q:1,r:''});$('bl').innerHTML=billRows()">＋ Add line</button>`}
 <div class="btot"><span>Total</span><b id="btot">${inr(billTotal())}</b></div>
 <div class="fld" style="margin-top:8px"><label>Notes on the quotation</label><textarea id="bnote" rows="3" ${billed?'readonly':''} placeholder="e.g. 2 cameras replaced, 1 year warranty, payment within 7 days">${esc(s.bill_note||'')}</textarea></div>
 <div class="row" style="padding:10px 0 0;gap:8px;flex-wrap:wrap">${billed?'':`<button class="btn g" onclick="billSave(${s.id})">💾 Save quotation</button><button class="btn" onclick="billConvert(${s.id})">➜ Convert to bill</button>`}<button class="btn g" onclick="billPrint(${s.id})">🖨 ${billed?'Print bill':'Print quotation'}</button></div></div>`}
const billTotal=()=>BL.reduce((t,x)=>t+(+x.q||0)*(+x.r||0),0);
function billRows(ro){return `<div class="brow bh"><span>Item / work</span><span>Qty</span><span>Rate ₹</span><span>Amount</span><span></span></div>`+BL.map((x,i)=>`<div class="brow"><input value="${esc(x.d||'')}" placeholder="Description" ${ro?'readonly':''} oninput="BL[${i}].d=this.value"><input type="number" inputmode="decimal" value="${x.q??1}" ${ro?'readonly':''} oninput="BL[${i}].q=this.value;bSum()"><input type="number" inputmode="decimal" value="${x.r??''}" ${ro?'readonly':''} oninput="BL[${i}].r=this.value;bSum()"><b id="ba${i}">${inr((+x.q||0)*(+x.r||0))}</b>${ro?'<span></span>':`<button class="ib sm" onclick="BL.splice(${i},1);if(!BL.length)BL.push({d:'',q:1,r:''});$('bl').innerHTML=billRows();bSum()" aria-label="Remove">✕</button>`}</div>`).join('')}
function bSum(){BL.forEach((x,i)=>{const e=$('ba'+i);if(e)e.textContent=inr((+x.q||0)*(+x.r||0))});$('btot').textContent=inr(billTotal())}
async function billSave(id,quiet){const r=await api(`/api/services/${id}/bill`,{m:'PUT',b:{items:BL,note:$('bnote').value}});if(r.error){toast(r.error);return false}if(!quiet)toast('Quotation saved ✓');return true}

BIF.vendors={...BIF.customers,name:'Vendor name'};delete BIF.vendors.city;delete BIF.vendors.pincode;delete BIF.vendors.ship_address;
async function biImport(what){await biMeta();window._BIW={what};const W={products:'Products',customers:'Customers',vendors:'Vendors'};
 modal(`<div class="row"><div class="sp"><div class="kick">Import</div><h2 style="margin:0">⬆️ Import from Swipe / Excel</h2></div>${X}</div>
 <div class="seg" id="imW">${Object.keys(W).filter(k=>k!='vendors'||biBuy()).map(k=>`<button class="${k==what?'on':''}" onclick="segPick(this);window._BIW.what='${k}';$('imTpl').href='/api/bl/import/template/${k}'">${W[k]}</button>`).join('')}</div>
 <ol class="wsteps"><li>In <b>Swipe</b>: open <i>Products</i> (or <i>Customers / Vendors</i>) → <b>⋮ / Download → Export to Excel</b>.</li><li>Choose that file below — .xlsx or .csv. Columns are matched automatically and you can fix any match before importing.</li><li>Same name / code / phone already here? It's <b>updated</b>, not duplicated.</li></ol>
 <label class="biup"><input type="file" id="imF" accept=".xlsx,.csv,.tsv,.txt,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,text/csv" onchange="biImpRead()"><span>📄 Choose Excel / CSV file</span></label>
 <div class="dim" style="font-size:12.5px;margin-top:8px">No Swipe file? <a id="imTpl" href="/api/bl/import/template/${what}">Download our Excel template</a>, fill it and upload.</div>
 <div class="ferr" id="imE"></div><div id="imP"></div>`);biWide()}
async function biImpRead(){const f=$('imF').files[0];if(!f)return;if(f.size>15e6){$('imE').textContent='File too big (max 15 MB)';return}$('imE').textContent='';$('imP').innerHTML='<div class="dim" style="padding:14px">Reading the file…</div>';
 const data=await new Promise(r=>{const rd=new FileReader();rd.onload=()=>r(rd.result);rd.readAsDataURL(f)});const W=window._BIW;
 const r=await api('/api/bl/import/preview',{m:'POST',b:{what:W.what,file:data,fname:f.name}});if(r.error){$('imP').innerHTML='';$('imE').textContent=r.error;return}
 Object.assign(W,r);const F=BIF[W.what];
 $('imP').innerHTML=`<div class="box" style="margin-top:12px"><b>${r.count} rows found</b> in ${esc(f.name)}. Check which column is which:</div>
 <div class="bimap">${Object.keys(F).map(k=>`<div class="fld"><label>${F[k]}</label><select id="imm_${k}"><option value="">— not in file —</option>${r.headers.map((h,i)=>`<option value="${i}" ${r.map[k]===i?'selected':''}>${esc(h||'Column '+(i+1))}</option>`).join('')}</select></div>`).join('')}</div>
 <div class="sec3">First rows</div><div class="bitw"><table class="bisam"><tr>${r.headers.map(h=>`<th>${esc(h)}</th>`).join('')}</tr>${r.sample.map(s=>`<tr>${r.headers.map((h,i)=>`<td>${esc(s[i]??'')}</td>`).join('')}</tr>`).join('')}</table></div>
 ${W.what=='customers'&&BI.meta.brands.length>1&&!ME.brand_id?`<div class="fld" style="margin-top:10px"><label>Brand for new customers</label><select id="imB">${BI.meta.brands.map(b=>`<option value="${b.id}">${esc(b.name)}</option>`).join('')}</select></div>`:''}
 <label class="rtg" style="margin-top:10px"><input type="checkbox" id="imU" checked><span class="sw"></span><span><b>Update ones that already exist</b><small>Off = skip them and only add new ones</small></span></label>
 <button class="btn big" id="imS" style="width:100%;margin-top:14px" onclick="biImpGo()">Import ${r.count} ${W.what}</button>`}
async function biImpGo(){const W=window._BIW,map={};Object.keys(BIF[W.what]).forEach(k=>{const v=$('imm_'+k).value;if(v!=='')map[k]=+v});
 if(W.what=='products'&&map.name===undefined){$('imE').textContent='Choose which column has the product name';return}
 $('imS').disabled=true;$('imS').textContent='Importing…';const r=await api('/api/bl/import/commit',{m:'POST',b:{token:W.token,map,mode:$('imU').checked?'update':'skip',brand_id:$('imB')?$('imB').value:null}});
 if(r.error){$('imS').disabled=false;$('imS').textContent='Import';$('imE').textContent=r.error;return}
 $('imP').innerHTML=`<div class="box biok"><b>✅ Import finished</b><div>${r.created} added · ${r.updated} updated · ${r.skipped} skipped</div>${r.errors.length?`<div class="ferr" style="margin-top:8px">${r.errors.map(esc).join('<br>')}</div>`:''}</div><button class="btn big" style="width:100%;margin-top:14px" onclick="closeM();BI.tab='${W.what=='customers'?'bcust':W.what}';BI.meta=null;nav('bill')">Done</button>`;
 $('imF').value=''}

/* ---------- settings (Super Admin): brand GST profile, bank, logo, numbering ---------- */
async function biSettings(){await biMeta(true);const id=+(BI.sbrand||BI.meta.brands[0].id),b=biBrand(id);BI.sbrand=id;window._BLOGO=undefined;
 const f=(k,l,ph='',t='text')=>`<div class="fld"><label>${l}</label><input id="bs_${k}" type="${t}" value="${esc(b[k]??'')}" placeholder="${ph}"></div>`;
 $('bibody').innerHTML=`${BI.meta.brands.length>1?`<div class="chips" style="margin-bottom:10px">${BI.meta.brands.map(x=>`<button class="chp ${x.id==id?'on':''}" onclick="BI.sbrand=${x.id};biBody()">${esc(x.name)}</button>`).join('')}</div>`:''}
 <div class="panel bisets"><div class="sec3" style="margin-top:0">Business details on bills · ${esc(b.name)}</div>
 <div class="bilogo"><div id="bsLp">${b.has_logo?`<img src="/bl-logo/${b.id}?v=${b.v}">`:'<span>Logo</span>'}</div><div><label class="btn g sm"><input type="file" accept="image/*" hidden onchange="biLogo(this)">⬆️ Upload logo</label>${b.has_logo?` <button class="btn g sm" onclick="window._BLOGO=null;$('bsLp').innerHTML='<span>Logo</span>'">Remove</button>`:''}<div class="dim" style="font-size:12px;margin-top:4px">PNG / JPG, shown at the top of every bill</div></div></div>
 <div class="fg2">${f('legal_name','Legal / business name',b.name)}${f('gstin','GSTIN','33ABCDE1234F1Z5')}</div>
 <div class="fg2" style="margin-top:10px"><div class="fld"><label>State</label><select id="bs_state"><option value="">—</option>${BI.meta.states.map(s=>`<option ${b.state==s?'selected':''}>${esc(s)}</option>`).join('')}</select></div>${f('phone','Phone')}</div>
 <div class="fld" style="margin-top:10px"><label>Address</label><textarea id="bs_address" rows="2">${esc(b.address||'')}</textarea></div>
 <div class="fg2" style="margin-top:10px">${f('email','Email','','email')}${f('website','Website')}</div>
 <div class="sec3">Bank &amp; UPI (printed on invoices)</div><div class="fg2">${f('bank_name','Bank name')}${f('bank_account','Account number')}</div><div class="fg2" style="margin-top:10px">${f('bank_ifsc','IFSC')}${f('bank_branch','Branch')}</div><div class="fg2" style="margin-top:10px">${f('upi','UPI ID','name@bank')}${f('sign_name','Authorised signatory name')}</div>
 <div class="sec3">Defaults</div><div class="fg2"><div class="fld"><label>Default GST %</label><select id="bs_default_tax">${BI.meta.taxes.map(t=>`<option ${+b.default_tax==t?'selected':''}>${t}</option>`).join('')}</select></div>
 <div class="fld"><label>Print design</label><select id="bs_template">${[['modern','Modern (colour header)'],['classic','Classic (bordered GST table)'],['thermal','Thermal 3-inch']].map(x=>`<option value="${x[0]}" ${b.template==x[0]?'selected':''}>${x[1]}</option>`).join('')}</select></div></div>
 <div class="fg2" style="margin-top:10px"><div class="fld"><label>Brand colour</label><input id="bs_color" type="color" value="${esc(b.color||'#1f6f5c')}" style="height:44px;padding:4px"></div><label class="rtg" style="margin-top:22px"><input type="checkbox" id="bs_round_off" ${b.round_off?'checked':''}><span class="sw"></span><span><b>Round off totals</b></span></label></div>
 <div class="fld" style="margin-top:10px"><label>Terms &amp; conditions (default on bills)</label><textarea id="bs_terms" rows="3" placeholder="e.g. Goods once sold will not be taken back. Warranty as per manufacturer.">${esc(b.terms||'')}</textarea></div>
 <div class="sec3">Numbering</div><p class="dim" style="margin-top:-4px">Continuing from Swipe? Put your next number here (e.g. Swipe's last invoice INV-245 → next 246).</p>
 <div class="binum">${Object.keys(BT1).map(t=>`<div class="fld"><label>${BT1[t]}</label><div class="row" style="padding:0;gap:6px"><input id="bsp_${t}" value="${esc((b.prefixes||{})[t]??'')}" placeholder="Prefix" style="flex:1"><input id="bsn_${t}" type="number" value="${esc((b.next_no||{})[t]??'')}" placeholder="Next no." style="flex:1"></div></div>`).join('')}</div>
 <div class="ferr" id="bsE"></div><div class="row" style="padding:14px 0 0;gap:8px"><button class="btn big sp" id="bsS" onclick="biSetSave(${id})">Save settings</button></div></div>`}
function biLogo(inp){const f=inp.files[0];if(!f)return;shrink(f,600).then(d=>{window._BLOGO=d;$('bsLp').innerHTML=`<img src="${d}">`}).catch(()=>toast('Could not read the image'))}
async function biSetSave(id){const v=k=>($('bs_'+k)||{}).value,b={};['legal_name','gstin','state','phone','address','email','website','bank_name','bank_account','bank_ifsc','bank_branch','upi','sign_name','default_tax','template','color','terms'].forEach(k=>b[k]=v(k));
 b.round_off=$('bs_round_off').checked;b.prefixes={};b.next_no={};Object.keys(BT1).forEach(t=>{b.prefixes[t]=$('bsp_'+t).value;if($('bsn_'+t).value)b.next_no[t]=$('bsn_'+t).value});if(window._BLOGO!==undefined)b.logo=window._BLOGO;
 $('bsS').disabled=true;const r=await api('/api/bl/brand/'+id,{m:'PUT',b});$('bsS').disabled=false;if(r.error){$('bsE').textContent=r.error;return}toast('Settings saved ✓');biSettings()}

/* ---------- links into leads, tickets and customers ---------- */
async function biFromLead(id){const l=await api('/api/leads/'+id);if(l.error)return toast(l.error);closeM();
 biEdit('quotation',{lead_id:id,customer_id:l.customer_id||null,party:{name:l.name,company:l.company||'',phone:l.phone||'',email:l.email||'',address:l.address||''},brand_id:l.brand_id||null})}
async function biLeadDocs(id){if(!can('billing'))return;const r=await api(`/api/bl/docs?type=quotation,invoice,proforma,challan&lead_id=${id}`);const anchor=[...document.querySelectorAll('#mroot .md button')].find(b=>/leadForm\(/.test(b.getAttribute('onclick')||''));if(!anchor||r.error)return;
 anchor.parentNode.insertAdjacentHTML('beforebegin',`<div class="sec3">🧾 Quotations &amp; invoices</div>${(r.items||[]).map(d=>`<button class="crow1" onclick="biView(${d.id})"><b>${BTI[d.type]} ${esc(d.no)}</b><span>${BT1[d.type]} · ${bd(d.doc_date)} · ${bm(d.total)} · <span class="badge ${BSC[d.status]||''}">${esc(d.status)}</span></span><i>›</i></button>`).join('')}<button class="btn g sm" style="margin-top:6px" onclick="biFromLead(${id})">＋ New quotation</button>`)}
async function biTicketDocs(id){if(!can('billing'))return;const box=document.querySelector('#mroot .billbox');const r=await api(`/api/bl/docs?type=invoice,quotation,proforma&service_id=${id}`);if(r.error)return;
 const html=`<div class="bitk"><div class="sec3" style="margin-top:12px">🧾 GST invoice</div>${(r.items||[]).map(d=>`<button class="crow1" onclick="biView(${d.id})"><b>${BTI[d.type]} ${esc(d.no)}</b><span>${bd(d.doc_date)} · ${bm(d.total)} · <span class="badge ${BSC[d.status]||''}">${esc(d.status)}</span></span><i>›</i></button>`).join('')}
 ${box?`<button class="btn g sm" style="margin-top:6px" onclick="biFromTicket(${id})">🧾 Make GST invoice from these lines</button><div class="hint">Uses the lines above (rates treated as including GST), links it to this ticket, and marks it paid when the ticket's payment is received.</div>`:''}</div>`;
 if(box)box.insertAdjacentHTML('beforeend',html);else if((r.items||[]).length){const m=$('mroot').querySelector('.md');if(m)m.insertAdjacentHTML('beforeend',html)}}
async function biFromTicket(id){const s=await api('/api/services/'+id);if(s.error)return toast(s.error);await biMeta();const b=biBrand(s.brand_id),lines=((typeof BL!='undefined'&&Array.isArray(BL)&&BL.some(x=>(x.d||'').trim()))?BL:(s.bill_items||[])).filter(x=>(x.d||'').trim());
 closeM();biEdit('invoice',{service_id:id,brand_id:s.brand_id,customer_id:s.customer_id,party:{name:s.customer||'',company:s.customer_company||'',phone:s.phone||'',email:s.email||'',address:s.address||''},
  items:lines.length?lines.map(x=>({name:x.d,qty:+x.q||1,rate:+x.r||0,tax:b.default_tax,incl:true,unit:'Nos'})):[{name:(s.service_type||'Service')+' · ticket #'+s.ticket_no,qty:1,rate:+s.charges_applied||0,tax:b.default_tax,incl:true}],notes:'Service ticket #'+s.ticket_no})}
async function biCustDocs(id){if(!can('billing'))return;const r=await api(`/api/bl/docs?type=invoice,quotation,proforma,challan,credit_note&customer_id=${id}`);const m=$('mroot').querySelector('.md');if(!m||r.error)return;const due=(r.totals||{}).due||0;
 const anchor=[...m.querySelectorAll('.sec3')].find(x=>/Payments received/.test(x.textContent));
 const html=`<div class="sec3">🧾 Bills &amp; quotations · ${r.items.length}${+due?` · <span class="neg">${inr(due)} due</span>`:''}</div>${r.items.slice(0,12).map(d=>`<button class="crow1" onclick="biView(${d.id})"><b>${BTI[d.type]} ${esc(d.no)}</b><span>${BT1[d.type]} · ${bd(d.doc_date)} · ${bm(d.total)} · <span class="badge ${BSC[d.status]||''}">${esc(d.status)}</span></span><i>›</i></button>`).join('')}
 <div class="row" style="padding:6px 0 0;gap:8px;flex-wrap:wrap"><button class="btn g sm" onclick="closeM();biEdit('invoice',{customer_id:${id},party:window.CUST1})">🧾 New invoice</button><button class="btn g sm" onclick="closeM();biEdit('quotation',{customer_id:${id},party:window.CUST1})">📝 New quotation</button><button class="btn g sm" onclick="biLedger('customer',${id})">📒 Ledger</button></div>`;
 if(anchor)anchor.insertAdjacentHTML('beforebegin',html);else m.insertAdjacentHTML('beforeend',html)}
(function(){const _ol=openLead,_ov=openView,_cf=custFull;
 openLead=async function(id){const r=await _ol.apply(this,arguments);biLeadDocs(id).catch(()=>{});return r};
 openView=async function(id){const r=await _ov.apply(this,arguments);biTicketDocs(id).catch(()=>{});return r};
 custFull=async function(id){const r=await _cf.apply(this,arguments);biCustDocs(id).catch(()=>{});return r}})();

const PRIM=['todo','tdash','jobs','dash','chat','services','leads','att','salary'];
function bottomNav(v){const all=menu().filter(n=>n[0]!='me'),prim=PRIM.map(k=>all.find(n=>n[0]==k)).filter(Boolean).slice(0,4),rest=all.filter(n=>!prim.includes(n));
 const moreOn=v=='me'||rest.some(n=>n[0]==v);
 $('bnav').innerHTML=prim.map(n=>`<button class="${n[0]==v?'on':''}" onclick="nav('${n[0]}')"><span>${ic(n[2],22)}</span><em>${n[0]=='todo'?'To-do':n[1]}</em>${n[0]=='chat'?'<i class="cbn" hidden></i>':''}${n[0]=='wa'?'<i class="cbn wbn" hidden></i>':''}</button>`).join('')+
  `<button class="${moreOn?'on':''}" onclick="moreSheet()"><span>${ic('grid',22)}</span><em>${moreOn&&v!='me'?(rest.find(n=>n[0]==v)||[0,'More'])[1]:'More'}</em></button>`;
 window._rest=rest}
function moreSheet(){const rest=window._rest||[];modal(`<div class="row" style="padding:0 0 10px"><div class="amh" style="border:0;padding:0;margin:0;flex:1"><div class="av">${ini(ME.name)}</div><div><b>${esc(ME.name)}</b><div class="dim">${esc(ME.role)}</div></div></div>${X}</div>
 <div class="mgrid">${rest.map(n=>`<button class="mt ${n[0]==view?'on':''}" onclick="closeM();nav('${n[0]}')"><span>${ic(n[2],24)}</span>${n[1]}</button>`).join('')}
 <button class="mt ${view=='me'?'on':''}" onclick="closeM();nav('me')"><span>${ic('cog',24)}</span>Profile</button>
 <button class="mt" onclick="toggleDark()"><span>${ic('moon',24)}</span>Dark mode</button>
 <button class="mt" onclick="closeM();setTimeout(toggleND,30)"><span>${ic('bell',24)}</span>Alerts</button>
 <button class="mt red" onclick="closeM();logout()"><span>${ic('out',24)}</span>Sign out</button></div>`)}

(async()=>{try{ME=await api('/api/me');await boot()}catch(e){if(!ME)showLogin()}
 if('serviceWorker' in navigator){navigator.serviceWorker.register('/sw.js').catch(()=>{});navigator.serviceWorker.addEventListener('message',e=>{if(!e.data)return;if(e.data.todo)openTodoLink(e.data.todo);else if(e.data.chat)openChatLink(e.data.chat);else if(e.data.att)openAttLink(e.data.att);else if(e.data.sid)gotoJob(e.data.sid)})}})();
