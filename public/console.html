<!doctype html>
<html lang="en" data-theme="light" style="color-scheme:light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rago Console</title><meta name="robots" content="noindex">
<link rel="icon" href="/logo.png"><link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f2ed;--card:#fff;--ink:#111113;--dim:#6c6c70;--line:rgba(60,60,67,.13);--gold:#e3aa2b;--gold2:#f2c55c;--ok:#1f9d55;--okd:rgba(31,157,85,.12);--bad:#d33a2f;--badd:rgba(211,58,47,.11);--warn:#b86a00;--warnd:rgba(255,149,0,.15);--side:#141416}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f0f11;--card:#1b1b1e;--ink:#f1f1f3;--dim:#a2a2a9;--line:rgba(255,255,255,.1)}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Jost,-apple-system,Segoe UI,Roboto,sans-serif}
button,input,select{font:inherit;color:inherit}.dim{color:var(--dim)}b{font-weight:700}
.login{max-width:380px;margin:12vh auto;background:var(--card);border-radius:24px;padding:26px}.login img{width:52px;border-radius:14px;background:#fff}
.in{width:100%;height:46px;border-radius:13px;border:1px solid var(--line);background:var(--bg);padding:0 13px}label.f{display:block;font-size:12.5px;font-weight:600;color:var(--dim);margin:12px 0 4px}
.btn{height:44px;border:0;border-radius:999px;padding:0 20px;font-weight:700;background:linear-gradient(180deg,var(--gold2),var(--gold));color:#16120a;cursor:pointer}.btn.g{background:var(--card);border:1px solid var(--line);color:var(--ink)}.btn.sm{height:34px;padding:0 13px;font-size:13.5px}.btn.red{color:var(--bad)}
.wrap{display:grid;grid-template-columns:220px 1fr;min-height:100vh}@media(max-width:860px){.wrap{grid-template-columns:1fr}.side{position:sticky;top:0;z-index:5;flex-direction:row!important;overflow-x:auto;padding:10px!important}.side .brand{display:none}}
.side{background:var(--side);color:#fff;padding:22px 14px;display:flex;flex-direction:column;gap:6px}.side .brand{display:flex;gap:10px;align-items:center;margin:0 6px 18px}.side .brand img{width:38px;border-radius:11px;background:#fff}
.nav{border:0;background:none;color:#b8b8c0;text-align:left;padding:10px 14px;border-radius:12px;cursor:pointer;font-weight:600;white-space:nowrap}.nav.on{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#16120a}.nav:hover:not(.on){background:rgba(255,255,255,.07);color:#fff}
.main{padding:24px clamp(14px,3vw,34px) 60px;min-width:0}h1{font-size:30px;margin:0 0 4px;letter-spacing:-.3px}.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}.kpi{background:var(--card);border-radius:18px;padding:14px 16px}.kpi small{display:block;color:var(--dim);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.6px}.kpi b{font-size:28px;display:block;line-height:1.2}.kpi span{font-size:12.5px;color:var(--dim)}
.card{background:var(--card);border-radius:20px;padding:16px;margin-top:16px}.card h3{margin:0 0 10px;font-size:17px}
.bars{display:flex;align-items:flex-end;gap:8px;height:140px;padding-top:10px}.bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}.bar i{display:block;width:100%;max-width:38px;background:var(--gold);border-radius:8px 8px 3px 3px;min-height:3px}.bar small{font-size:11px;color:var(--dim)}.bar b{font-size:12px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.tools .in{height:40px;width:auto;flex:1;min-width:160px}.tools select{height:40px;border-radius:13px;border:1px solid var(--line);background:var(--card);padding:0 10px}
.tbl{width:100%;border-collapse:collapse}.tbl th{text-align:left;font-size:12px;color:var(--dim);font-weight:600;text-transform:uppercase;letter-spacing:.5px;padding:8px;border-bottom:1px solid var(--line)}.tbl td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}.tbl tr.c{cursor:pointer}.tbl tr.c:hover td{background:rgba(227,170,43,.07)}
.tw{overflow-x:auto}.badge{display:inline-block;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700;background:var(--line)}.badge.ok{background:var(--okd);color:var(--ok)}.badge.bad{background:var(--badd);color:var(--bad)}.badge.warn{background:var(--warnd);color:var(--warn)}
.ev{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}.ev .ic{width:30px;height:30px;border-radius:10px;background:var(--bg);display:grid;place-items:center;flex:none}.ev small{color:var(--dim)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;justify-content:flex-end;z-index:20}.drawer{width:min(760px,100%);height:100%;overflow:auto;background:var(--bg);padding:22px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sp{flex:1}.mods{display:flex;flex-wrap:wrap;gap:6px}.mods label{border:1px solid var(--line);border-radius:999px;padding:5px 12px;cursor:pointer;background:var(--card)}.mods input{accent-color:var(--gold)}
.err{color:var(--bad);font-weight:600;min-height:20px;margin-top:8px}
.pbar2{height:8px;border-radius:99px;background:rgba(127,127,127,.18);margin-top:10px;overflow:hidden}.pbar2 i{display:block;height:100%;background:linear-gradient(90deg,#f2c55c,#b07d0e);border-radius:99px}
.drawer .kpi{min-width:0}@media(max-width:640px){.drawer .kpis{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:8px}.drawer .kpi b{font-size:18px!important}}.drawer a.btn{text-decoration:none}

</style></head>
<body><div id="app"></div>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const inr=n=>'₹'+Number(n||0).toLocaleString('en-IN'),dt=d=>d?new Date(d).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}):'—';
const ago=d=>{if(!d)return 'never';const m=Math.round((Date.now()-new Date(d))/6e4);return m<2?'just now':m<60?m+' min ago':m<1440?Math.round(m/60)+' h ago':Math.round(m/1440)+' days ago'};
const api=async(u,o)=>{const r=await fetch(u,o?{method:o.m,headers:{'Content-Type':'application/json'},body:JSON.stringify(o.b)}:{});const j=await r.json().catch(()=>({}));if(r.status==401||r.status==403&&/owner/.test(j.error||''))return {error:j.error||'Login required',auth:true};return j};
const EVI={reminder:'⏰',paid:'💰',login:'🔑',signup:'🎉',user_added:'👤',plan_changed:'⭐',company_paused:'⏸',company_activated:'▶️',account_deleted:'🗑'};
const EVT=e=>{const d=e.detail||{};return {login:`${esc(e.by_name)} logged in`,signup:`New company signed up · ${esc(d.plan)}${d.seats?' · '+d.seats+' users':''}`,user_added:`${esc(e.by_name)} added ${esc(d.name)} (${esc(d.role)})`,reminder:`⏰ ${d.kind=='soon'?'Plan ends in '+d.left+' day(s)':'Plan ended'} — reminder ${d.mailed?'emailed':'shown in app (email not set up)'}`,paid:`💰 Paid ${inr(d.amount||0)} · ${d.seats||''} users · ${d.months||1} month(s) · till ${esc(d.until||'')}`,plan_changed:`Plan → ${esc(d.plan)} · ${(d.modules||[]).join(', ')} · ${d.seats} users`,company_paused:'Company paused',company_activated:'Company activated'}[e.kind]||esc(e.kind)};
let S={tab:'dash',q:'',fplan:'',D:null,MODS:[]};
async function start(){const me=await api('/api/me');if(me.error||!me.owner)return login(me.owner===false?'This console is only for the Rago owner.':'');const pl=await api('/api/plans');S.MODS=pl.modules||[];S.ADDONS=pl.addons||[];S.P=pl;shell();load()}
function login(msg){$('app').innerHTML=`<form class="login" onsubmit="doLogin(event)"><img src="/logo.png" alt=""><h2 style="margin:10px 0 0">Rago Console</h2><p class="dim" style="margin:2px 0 8px">For the Rago owner only.</p>
 <label class="f" for="u">Username</label><input class="in" id="u" autocomplete="username" autocapitalize="none" required><label class="f" for="p">Password</label><input class="in" id="p" type="password" autocomplete="current-password" required>
 <div class="err" id="le">${esc(msg||'')}</div><button class="btn" style="width:100%;margin-top:6px">Sign in</button></form>`}
async function doLogin(e){e.preventDefault();const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('u').value.trim(),password:$('p').value})});const j=await r.json();if(j.error)return $('le').textContent=j.error;if(!j.owner){await fetch('/api/logout',{method:'POST'});return $('le').textContent='This console is only for the Rago owner.'}start()}
function shell(){$('app').innerHTML=`<div class="wrap"><nav class="side"><div class="brand"><img src="/logo.png" alt=""><div><b>Rago Console</b><div style="font-size:12px;color:#9a9aa3">Owner</div></div></div>
 ${[['dash','📊 Overview'],['cos','🏢 Companies'],['act','🕘 Activity']].map(t=>`<button class="nav ${S.tab==t[0]?'on':''}" data-t="${t[0]}" onclick="S.tab='${t[0]}';shell();draw()">${t[1]}</button>`).join('')}
 <button class="nav" onclick="location.href='/'">↗ Open CRM</button><button class="nav" onclick="fetch('/api/logout',{method:'POST'}).then(()=>login())">⎋ Sign out</button></nav><div class="main" id="main"><div class="dim">Loading…</div></div></div>`}
async function load(){const r=await api('/api/console/overview');if(r.auth)return login();if(r.error)return $('main').innerHTML=esc(r.error);S.D=r;draw()}
function draw(){if(!S.D)return;if(S.tab=='dash')drawDash();else if(S.tab=='cos')drawCos();else drawAct()}
function drawDash(){const t=S.D.totals,g=S.D.growth,mx=Math.max(1,...g.map(x=>x.n));
 $('main').innerHTML=`<div class="top"><div><h1>Overview</h1><div class="dim">Every company using Rago CRM · updated ${new Date().toLocaleTimeString('en-IN',{hour:'numeric',minute:'2-digit'})}</div></div><button class="btn g sm" onclick="load()">↻ Refresh</button></div>
 <div class="kpis">${[['Companies',t.companies,`${t.active} active · ${t.paused} paused`],['Paid',t.paid,'companies'],['On trial',t.trial,`worth ${inr(t.trial_value)}/month`],['Free plan',t.free,'companies'],['Users',t.users,'active logins'],['Active today',t.active_today,'users seen in 24 h'],['New this month',t.new_this_month,'companies'],['Monthly revenue',inr(t.monthly),'from paid plans (before GST)']].map(k=>`<div class="kpi"><small>${k[0]}</small><b>${k[1]}</b><span>${k[2]}</span></div>`).join('')}</div>
 <div class="card"><h3>New companies per month</h3>${g.length?`<div class="bars">${g.map(x=>`<div class="bar"><b>${x.n}</b><i style="height:${Math.round(x.n/mx*100)}px"></i><small>${x.m.slice(5)}/${x.m.slice(2,4)}</small></div>`).join('')}</div>`:'<div class="dim">No sign-ups yet.</div>'}</div>
 <div class="card"><h3>Most active companies (last 7 days)</h3>${cosTable(S.D.companies.filter(c=>c.id!==1).sort((a,b)=>b.active_week-a.active_week).slice(0,8))}</div>`}
function cosTable(L){return L.length?`<div class="tw"><table class="tbl"><tr><th>Company</th><th>Plan</th><th>Users</th><th>Active</th><th>Last seen</th><th>Since</th></tr>${L.map(c=>`<tr class="c" data-id="${c.id}" onclick="openCo(${c.id})"><td><b>${esc(c.name)}</b><div class="dim" style="font-size:13px">${[c.owner_name,c.phone,c.city].filter(Boolean).map(esc).join(' · ')}</div></td>
 <td>${planBadge(c)}${c.monthly?`<div class="dim" style="font-size:12.5px">${inr(c.monthly)}/mo</div>`:''}</td><td>${c.active_users} / ${c.seats>=1e5?'∞':c.seats}</td><td>${c.active_today} today<div class="dim" style="font-size:12.5px">${c.active_week} this week</div></td><td>${ago(c.last_seen)}</td><td>${dt(c.created_at)}</td></tr>`).join('')}</table></div>`:'<div class="dim">No companies yet.</div>'}
function dLeft(d){if(!d)return '';const n=Math.round((new Date(String(d).slice(0,10)+'T00:00:00')-new Date(new Date().toISOString().slice(0,10)+'T00:00:00'))/864e5);return n<0?'ended':n==0?'last day':n+' day'+(n==1?'':'s')+' left'}
function planBadge(c){if(c.id===1)return '<span class="badge">You</span>';if(c.status!=='active')return `<span class="badge bad">${c.status=='suspended'?'Paused':c.status=='deletion_requested'?'Asked to delete':esc(c.status)}</span>`;return {paid:'<span class="badge ok">Paid</span>',trial:`<span class="badge warn">Trial · ${dLeft(c.trial_until)}</span>`,free:c.plan=='trial'||c.plan=='paid'?'<span class="badge bad">Ended → Free</span>':'<span class="badge">Free</span>'}[c.plan_now]||esc(c.plan_now)}
function drawCos(){let L=S.D.companies;const q=S.q.toLowerCase();if(q)L=L.filter(c=>[c.name,c.owner_name,c.phone,c.email,c.city].join(' ').toLowerCase().includes(q));if(S.fplan)L=L.filter(c=>S.fplan=='paused'?c.status!=='active':c.plan_now==S.fplan&&c.status=='active');
 $('main').innerHTML=`<div class="top"><div><h1>Companies</h1><div class="dim">${S.D.totals.companies} companies · ${S.D.totals.users} users</div></div><button class="btn sm" onclick="newCo()">＋ New company</button></div>
 <div class="tools"><input class="in" id="cq" placeholder="Search name, owner, phone, city…" value="${esc(S.q)}" oninput="S.q=this.value;clearTimeout(window._t);window._t=setTimeout(drawCos,250)"><select id="cp" onchange="S.fplan=this.value;drawCos()">${[['','All plans'],['paid','Paid'],['trial','Trial'],['free','Free'],['paused','Paused / deleted']].map(o=>`<option value="${o[0]}" ${S.fplan==o[0]?'selected':''}>${o[1]}</option>`).join('')}</select></div>
 <div class="card" style="margin-top:0">${cosTable(L)}</div>`;const i=$('cq');if(i&&q){i.focus();i.setSelectionRange(i.value.length,i.value.length)}}
async function drawAct(){const cos=S.D.companies;$('main').innerHTML=`<div class="top"><div><h1>Activity</h1><div class="dim">Logins, sign-ups, staff added, plan changes — all companies</div></div></div>
 <div class="tools"><select id="ac" onchange="actLoad()"><option value="">All companies</option>${cos.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select><select id="ak" onchange="actLoad()"><option value="">Everything</option>${Object.keys(EVI).map(k=>`<option value="${k}">${k.replace('_',' ')}</option>`).join('')}</select></div><div class="card" style="margin-top:0" id="acl"><div class="dim">Loading…</div></div>`;actLoad()}
async function actLoad(){const r=await api(`/api/console/activity?company=${($('ac')||{}).value||''}&kind=${($('ak')||{}).value||''}`);if(!Array.isArray(r))return;$('acl').innerHTML=r.length?r.map(e=>`<div class="ev"><div class="ic">${EVI[e.kind]||'•'}</div><div><b>${esc(e.company||'')}</b> — ${EVT(e)}<br><small>${new Date(e.at).toLocaleString('en-IN',{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'})}</small></div></div>`).join(''):'<div class="dim">Nothing yet.</div>'}
const ML={leads:'Leads',service:'Service',billing:'Billing',attendance:'Attendance',field:'Field Sales',whatsapp:'WhatsApp & Mail'};
function coInfo(r){const c=r.company,own=c.id===1,sm=r.summary||{},u=r.usage||{},st=r.staff||{},k=r.counts||{},ph=String(c.phone||'').replace(/\D/g,'');
 const kindL=own?'Owner':sm.kind=='trial'?'Free trial':sm.kind=='paid'?'Paid':sm.expired?(sm.was=='paid'?'Plan ended → Free':'Trial ended → Free'):'Free';
 const tone=own?'':sm.kind=='paid'?'ok':sm.kind=='trial'?'warn':sm.expired?'bad':'';
 const pct=sm.trial_days&&sm.kind=='trial'?Math.min(100,Math.round((sm.trial_days-(sm.days_left||0))/sm.trial_days*100)):null;
 const box=(l,v,s2)=>`<div class="kpi"><small>${l}</small><b style="font-size:20px">${v}</b><span>${s2||''}</span></div>`;
 return `<div class="dim">${[c.owner_name,c.city].filter(Boolean).map(esc).join(' · ')} · joined ${dt(c.created_at)}${c.source?' · from '+esc(c.source):''}</div>
 <div class="row" style="gap:8px;flex-wrap:wrap;margin-top:10px">${ph?`<a class="btn g sm" href="tel:${ph}">📞 ${esc(c.phone)}</a><a class="btn g sm" target="_blank" rel="noopener" href="https://wa.me/${ph.length==10?'91'+ph:ph}">💬 WhatsApp</a>`:''}${c.email?`<a class="btn g sm" href="mailto:${esc(c.email)}">✉ ${esc(c.email)}</a>`:''}</div>
 ${c.gstin?`<div class="dim" style="margin-top:8px">GSTIN <b>${esc(c.gstin)}</b>${c.bill_name?' · '+esc(c.bill_name):''}${c.bill_address?' · '+esc(c.bill_address):''}</div>`:''}
 <div class="card"><h3>Plan &amp; trial</h3><div class="row" style="gap:10px;flex-wrap:wrap;align-items:center"><span class="badge ${tone}" style="font-size:14px;padding:6px 12px">${kindL}</span>
  ${sm.kind=='trial'?`<b>${sm.days_left} day${sm.days_left==1?'':'s'} left</b><span class="dim">· ${dt(sm.joined)} → ${dt(sm.trial_until)}</span>`:sm.kind=='paid'?`<b>till ${dt(sm.paid_until)}</b><span class="dim">· ${sm.days_left!=null?sm.days_left+' days left':'no end date'}</span>`:sm.expired?`<span class="dim">ended ${dt(sm.was=='paid'?sm.paid_until:sm.trial_until)}</span>`:''}</div>
  ${pct!=null?`<div class="pbar2"><i style="width:${pct}%"></i></div>`:''}
  <div class="kpis" style="margin-top:12px">${box('Users',`${st.active??'—'} / ${own?'∞':sm.seats}`,'active / allowed')}${box('Branches',`${k.branches??'—'} / ${own?'∞':(sm.branch_limit||1)}`,'used / allowed')}${box('Monthly value',own?'—':inr(sm.kind=='paid'?((r.price||{}).monthly||0):((sm.chose_price||{}).monthly||0)),sm.kind=='paid'?'paying':'if they pay the plan they chose')}${box('Total paid',own?'—':inr(sm.paid_total||0),(r.payments||[]).length+' payment'+((r.payments||[]).length==1?'':'s'))}</div>
  <div style="margin-top:10px">${own?'':`<span class="dim">Modules on now:</span> ${(sm.modules||[]).map(m=>`<span class="badge">${esc(ML[m]||m)}</span>`).join(' ')}`}</div>
  ${sm.chose?`<div class="dim" style="margin-top:8px">Chose at sign-up: <b>${(sm.chose.modules||[]).includes('all')?'Whole CRM':esc((sm.chose.modules||[]).map(m=>ML[m]||m).join(', ')||'Free')}</b> · ${sm.chose.seats} users${sm.chose_price&&sm.chose_price.monthly?' · '+inr(sm.chose_price.monthly)+'/month':''}</div>`:''}</div>
 <div class="card"><h3>Usage</h3><div class="kpis">${box('Last active',u.last_seen?ago(u.last_seen):'never',u.last_seen_by?esc(u.last_seen_by):'')}${box('Last login',u.last_login?dt(u.last_login):'—',u.last_login_by?esc(u.last_login_by):'')}${box('Active users',`${u.active_today||0} · ${u.active_7||0} · ${u.active_30||0}`,'today · 7 days · 30 days')}${box('Logins',u.logins_30||0,'last 30 days')}</div></div>
 <div class="card"><h3>Staff</h3><div class="kpis">${box('Total',st.total??'—','')}${box('Active',st.active??'—','')}${box('Switched off',st.off??0,'')}</div><div style="margin-top:10px">${Object.entries(st.roles||{}).map(([ro,n])=>`<span class="badge">${esc(ro)} · ${n}</span>`).join(' ')||'<span class="dim">No staff yet</span>'}</div></div>
 <div class="card"><h3>Data</h3><div class="kpis">${box('Leads',k.leads??'—',k.leads_30!=null?k.leads_30+' in 30 days':'')}${box('Customers',k.customers??'—','')}${box('Quotations',k.quotations??'—','')}${box('Invoices',k.invoices??'—',k.invoices_month!=null?k.invoices_month+' this month · '+inr(k.billed_month||0):'')}${box('Service tickets',k.services??'—','')}${box('Products',k.products??'—','')}${box('Attendance',k.attendance_30??'—','days marked · 30 days')}${box('Field visits',k.visits_30??'—','30 days')}${box('Calls',k.calls_30??'—','30 days')}</div></div>`}
async function resendInv(o){const r=await api('/api/console/payment/'+encodeURIComponent(o)+'/resend',{m:'POST'});alert(r.sent?'Invoice emailed to '+(r.to||[]).join(', '):'Not sent: '+(r.why||r.error||'set up the Brevo email key in your CRM (Profile → Email)'))}
async function openCo(id){const r=await api('/api/console/company/'+id);if(r.error)return alert(r.error);const c=r.company,pl=c.plan_now,own=c.id===1,mods=Array.isArray(c.modules)?c.modules:[];
 const ov=document.createElement('div');ov.className='ov';ov.onclick=e=>{if(e.target==ov)ov.remove()};
 ov.innerHTML=`<div class="drawer" id="dw"><div class="row"><h1 class="sp" style="font-size:24px">${esc(c.name)}</h1><button class="btn g sm" onclick="this.closest('.ov').remove()">✕</button></div>
 ${coInfo(r)}
 ${own?'':`<div class="card"><h3>Plan</h3><div class="row"><select class="in" id="pp" style="width:auto">${['free','trial','paid'].map(p=>`<option ${c.plan==p?'selected':''}>${p}</option>`).join('')}</select><label class="dim">Users <input class="in" id="ps" type="number" min="1" value="${c.seats||5}" style="width:90px;height:40px"></label><label class="dim">Branches <input class="in" id="pbr" type="number" min="1" value="${c.branches||1}" style="width:76px;height:40px"></label><label class="dim">Until <input class="in" id="pu" type="date" value="${String((c.plan=='paid'?c.paid_until:c.trial_until)||'').slice(0,10)}" style="width:auto;height:40px"></label></div>
  <div class="mods" style="margin-top:10px"><label><input type="checkbox" value="all" ${mods.includes('all')?'checked':''}> Whole CRM</label>${S.MODS.map(m=>`<label><input type="checkbox" value="${m.k}" ${mods.includes(m.k)?'checked':''}> ${esc(m.l)}</label>`).join('')}${(S.ADDONS||[]).map(m=>`<label title="Add-on, not charged yet"><input type="checkbox" value="${m.k}" ${mods.includes(m.k)?'checked':''}> ➕ ${esc(m.l)} (add-on)</label>`).join('')}</div>
  <div class="dim" style="font-size:13px;margin-top:8px">Use this when a company pays by bank transfer, or to extend a trial. Razorpay payments will update this by themselves.</div><div class="err" id="pe"></div>
  <div class="row"><button class="btn sm" onclick="savePlan(${c.id})">Save plan</button><span class="sp"></span>${c.status=='active'?`<button class="btn g sm" onclick="coSt(${c.id},'suspended')">⏸ Pause</button>`:`<button class="btn g sm" onclick="coSt(${c.id},'active')">▶ Activate</button>`}<button class="btn g sm red" onclick="coDel(${c.id},'${esc(c.name).replace(/'/g,"\\'")}')">🗑 Delete</button></div></div>`}
 ${r.payments&&r.payments.length?`<div class="card"><h3>💰 Payments</h3><div class="tw"><table class="tbl"><tr><th>Date</th><th>Amount</th><th>For</th><th>Paid till</th></tr>${r.payments.map(x=>`<tr><td>${dt(x.paid_at)}<div class="dim" style="font-size:12px">${esc(x.inv_no||'')}</div><div style="margin-top:4px"><a class="btn g sm" target="_blank" href="/api/pay/invoice/${encodeURIComponent(x.order_id)}">🧾 Invoice</a> <button class="btn g sm" onclick="resendInv('${esc(x.order_id)}')">✉ ${x.mailed_at?'Resend':'Send'}</button></div></td><td><b>${inr(x.amount)}</b><div class="dim" style="font-size:12px">incl. GST ${inr(x.gst||0)}${x.gstin?' · '+esc(x.gstin):''}</div></td><td>${x.seats} users · ${x.months} mo<div class="dim" style="font-size:12px">${(x.modules||[]).includes('all')?'Whole CRM':esc((x.modules||[]).join(', '))}</div></td><td>${dt(x.paid_until)}</td></tr>`).join('')}</table></div></div>`:''}
 <div class="card"><h3>Users</h3><div class="tw"><table class="tbl"><tr><th>Name</th><th>Role</th><th>Last seen</th><th>Last login</th></tr>${r.users.map(u=>`<tr><td><b>${esc(u.name)}</b>${u.active?'':' <span class="badge">off</span>'}<div class="dim" style="font-size:12.5px">${esc(u.username)}${u.phone?' · '+esc(u.phone):''}</div></td><td>${esc(u.role)}</td><td>${ago(u.last_seen)}</td><td>${u.last_login?dt(u.last_login):'—'}</td></tr>`).join('')}</table></div></div>
 <div class="card"><h3>Activity</h3>${r.events.length?r.events.map(e=>`<div class="ev"><div class="ic">${EVI[e.kind]||'•'}</div><div>${EVT(e)}<br><small>${new Date(e.at).toLocaleString('en-IN',{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'})}</small></div></div>`).join(''):'<div class="dim">Nothing yet.</div>'}</div>
 ${c.notes?`<div class="card"><h3>Notes</h3><div class="dim" style="white-space:pre-wrap">${esc(c.notes)}</div></div>`:''}</div>`;document.body.appendChild(ov)}
async function savePlan(id){const m=[...document.querySelectorAll('#dw .mods input:checked')].map(x=>x.value);const r=await api('/api/console/company/'+id+'/plan',{m:'POST',b:{plan:$('pp').value,seats:+$('ps').value,branches:+$('pbr').value,until:$('pu').value,modules:m}});if(r.error)return $('pe').textContent=r.error;document.querySelector('.ov').remove();await load();openCo(id)}
async function coSt(id,st){if(st=='suspended'&&!confirm('Pause this company? Their staff cannot log in.'))return;const r=await api('/api/platform/companies/'+id,{m:'PATCH',b:{status:st}});if(r.error)return alert(r.error);document.querySelector('.ov').remove();await load();openCo(id)}
async function coDel(id,name){const n=prompt('Delete "'+name+'" and ALL its data for good? Type the company name to confirm:');if(n===null)return;const r=await api('/api/platform/companies/'+id,{m:'DELETE',b:{confirm:n}});if(r.error)return alert(r.error);document.querySelector('.ov').remove();load()}
function newCo(){const ov=document.createElement('div');ov.className='ov';ov.innerHTML=`<div class="drawer" style="width:min(520px,100%)"><div class="row"><h1 class="sp" style="font-size:24px">New company</h1><button class="btn g sm" onclick="this.closest('.ov').remove()">✕</button></div>
 ${[['name','Company name'],['owner_name','Owner name'],['phone','Phone'],['email','Email'],['city','City'],['username','Their username'],['password','Their password (6+)']].map(f=>`<label class="f" for="n_${f[0]}">${f[1]}</label><input class="in" id="n_${f[0]}">`).join('')}
 <div class="err" id="ne"></div><button class="btn" style="width:100%" onclick="newCoGo()">Create company</button></div>`;document.body.appendChild(ov)}
async function newCoGo(){const b={};['name','owner_name','phone','email','city','username','password'].forEach(k=>b[k]=$('n_'+k).value.trim());const r=await api('/api/platform/companies',{m:'POST',b});if(r.error)return $('ne').textContent=r.error;document.querySelector('.ov').remove();load()}
start();setInterval(()=>{if(S.D&&document.visibilityState=='visible'&&!document.querySelector('.ov'))load()},60000);
</script></body></html>
