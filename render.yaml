services:
  - type: web
    name: genzy
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: genzy-db, property: connectionString }
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: NODE_VERSION
        value: 20
databases:
  - name: genzy-db
    plan: free
