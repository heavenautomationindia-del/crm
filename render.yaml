services:
  - type: web
    name: rago-crm
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: rago-crm-db, property: connectionString }
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        value: Admin123
      - key: NODE_VERSION
        value: 20
databases:
  - name: rago-crm-db
    plan: free
